services:
  discord-bot:
    build: .
    image: ghcr.io/takaeru/discord-music-bot:latest
    container_name: discord-music-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - RUST_LOG=${RUST_LOG:-info}
      - BOT_LANG=${BOT_LANG:-en}
      - NOW_PLAYING_BEHAVIOR=${NOW_PLAYING_BEHAVIOR:-old}
      - MAX_PLAYLIST_ITEMS=${MAX_PLAYLIST_ITEMS:-50}
      - MONGO_USER=${MONGO_USER:-}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-}
      - MONGO_HOST=${MONGO_HOST:-}
      - MONGO_APP_NAME=${MONGO_APP_NAME:-}
      - MONGO_DATABASE=${MONGO_DATABASE:-}
      - MONGODB_URI=${MONGODB_URI:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    # Standalone Compose limit fallbacks
    mem_limit: 256M
    cpus: 0.75
